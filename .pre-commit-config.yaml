# Install once: brew install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/lab1/
      - id: end-of-file-fixer
        exclude: ^docs/lab1/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      # Каждый Python-проект проверяется со своим pyproject.toml (ruff находит его сам).
      - id: ruff-check
        args: [--fix]
        files: ^(data-generator|analysis)/
      - id: ruff-format
        files: ^(data-generator|analysis)/

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]

      - id: go-vet
        name: go vet
        entry: bash -c 'cd storage-engine && go vet ./...'
        language: system
        files: ^storage-engine/.*\.(go|mod|sum)$
        pass_filenames: false

      - id: go-test
        name: go test
        entry: bash -c 'cd storage-engine && go test -short ./...'
        language: system
        files: ^storage-engine/.*\.(go|mod|sum)$
        pass_filenames: false

      - id: pytest-data-generator
        name: pytest (data-generator)
        entry: bash -c 'cd data-generator && .venv/bin/python -m pytest -q'
        language: system
        files: ^data-generator/.*\.(py|toml|txt)$
        pass_filenames: false

      - id: pytest-analysis
        name: pytest (analysis)
        entry: bash -c 'cd analysis && .venv/bin/python -m pytest -q'
        language: system
        files: ^analysis/.*\.(py|toml|txt)$
        pass_filenames: false
