[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/W — стиль PEP 8, F — ошибки (неиспользуемые импорты и переменные),
# I — порядок импортов, B — частые баги, UP — современный синтаксис Python.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["config", "generate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
