name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  storage-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storage-engine
    env:
      COVERAGE_THRESHOLD: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: storage-engine/go.mod
          cache-dependency-path: storage-engine/go.sum

      - name: Install Fyne system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: |
          if [ -z "$(go list ./internal/... 2>/dev/null)" ]; then
            echo "No packages in internal/ yet, skipping tests"
            exit 0
          fi
          go test -race -coverprofile=coverage.out ./internal/...

      - name: Coverage threshold
        run: |
          if [ ! -f coverage.out ]; then
            echo "No coverage profile, skipping"
            exit 0
          fi
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Total coverage: ${total}% (threshold ${COVERAGE_THRESHOLD}%)"
          awk -v t="$total" -v min="$COVERAGE_THRESHOLD" 'BEGIN { exit !(t + 0 >= min + 0) }' || {
            echo "Coverage is below ${COVERAGE_THRESHOLD}%"
            exit 1
          }

  data-generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-generator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-generator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest -q

  dwh-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vetcare
          POSTGRES_PASSWORD: vetcare
          POSTGRES_DB: vetcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetcare -d vetcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: vetcare
      PGPASSWORD: vetcare
      PGDATABASE: vetcare

    steps:
      - uses: actions/checkout@v4

      - name: Apply schema
        run: psql -v ON_ERROR_STOP=1 -q -f dwh/01_schema.sql

      - name: Apply schema again (script must be re-runnable)
        run: psql -v ON_ERROR_STOP=1 -q -f dwh/01_schema.sql

      - name: Check tables
        run: |
          tables=$(psql -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'oltp'")
          echo "oltp tables: $tables"
          test "$tables" -eq 8
